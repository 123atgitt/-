<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>事件合約登入</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.45 system-ui, sans-serif; background: #101114; color: #f2f3f5; }
    main { max-width: 440px; margin: 0 auto; padding: 22px 14px 40px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: #b8bcc6; }
    label { display: block; margin: 12px 0 6px; font-size: 14px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #2c313a;
      background: #181b21; color: inherit; font-size: 16px;
    }
    button {
      border: 0; border-radius: 12px; background: #f0b90b; color: #1a1403;
      font-size: 16px; font-weight: 700; padding: 14px 16px;
    }
    button.secondary { background: #232833; color: #f2f3f5; font-weight: 600; }
    button:disabled { opacity: 0.55; }
    #go, #keys button { width: 100%; margin-top: 12px; }
    #out { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: #181b21; white-space: pre-wrap; }
    #out.warn { color: #ff8d8d; }
    #out.ok { color: #8ee0a8; }
    #screen {
      display: none; width: 100%; margin-top: 12px; border-radius: 12px; background: #000;
      touch-action: manipulation;
    }
    #keys { display: none; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
  </style>
</head>
<body>
<main>
  <h1>事件合約登入</h1>
  <p>按下去會打開幣安登入頁。你在畫面上自己登入，完成後登入狀態會送到交易機。下面要填的是監控網密碼。</p>
  <label for="pw">監控網密碼</label>
  <input id="pw" type="password" autocomplete="current-password" />
  <button id="go" type="button">打開幣安登入</button>
  <div id="out">還沒開始。</div>
  <img id="screen" alt="幣安登入頁" />
  <div id="keys">
    <label for="typed">打在登入頁上</label>
    <input id="typed" autocomplete="off" />
    <div class="row">
      <button id="send" class="secondary" type="button">送出這段字</button>
      <button id="back" class="secondary" type="button">退格</button>
    </div>
    <button id="enter" class="secondary" type="button">Enter</button>
  </div>
</main>
<script>
(function () {
  var out = document.getElementById("out");
  var pw = document.getElementById("pw");
  var screen = document.getElementById("screen");
  var keys = document.getElementById("keys");
  var liveId = "";
  var timer = 0;

  function api(path) {
    if (location.hostname.endsWith("github.io")) {
      return "https://autopredict.org/bots/api/event-login" + path;
    }
    return new URL("api/event-login" + path, document.baseURI).toString();
  }

  function say(text, kind) {
    out.textContent = text;
    out.className = kind || "";
  }

  async function post(path, body) {
    var res = await fetch(api(path), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body)
    });
    return res.json();
  }

  function showScreen(on) {
    screen.style.display = on ? "block" : "none";
    keys.style.display = on ? "block" : "none";
  }

  async function tick() {
    if (!liveId) return;
    try {
      var data = await (await fetch(api("/live/view?id=" + encodeURIComponent(liveId)))).json();
      if (data.phase === "starting") {
        say("正在打開幣安登入頁…\n電腦要開著，視窗也會出現在電腦上。");
        return;
      }
      if (data.phase === "ready") {
        say("這就是幣安登入頁。點畫面，或在下面打字。\n登完並點信任此裝置後，留在這頁。");
        if (data.has_frame) {
          screen.src = api("/live/frame?id=" + encodeURIComponent(liveId) + "&t=" + Date.now());
          showScreen(true);
        }
        return;
      }
      clearInterval(timer);
      timer = 0;
      showScreen(false);
      if (data.phase === "done") {
        say("已更新。\n登入還剩 " + (data.days || 0) + " 天 " + (data.hours || 0) + " 小時。", "ok");
      } else {
        say(data.error || "登入沒有完成。", "warn");
      }
    } catch (e) {
      say("跟監控網中斷了。若你已經登完，稍後再看監控網上的登入天數。", "warn");
    }
  }

  document.getElementById("go").onclick = async function () {
    var password = (pw.value || "").trim();
    if (!password) { say("先填監控網密碼。", "warn"); return; }
    this.disabled = true;
    say("正在打開幣安登入頁…");
    try {
      var data = await post("/live/start", { password: password });
      if (!data.ok || !data.id) {
        say(data.error || "沒有打開。", "warn");
        this.disabled = false;
        return;
      }
      liveId = data.id;
      if (timer) clearInterval(timer);
      timer = setInterval(tick, 800);
      tick();
    } catch (e) {
      say("連不到監控網。", "warn");
    }
    this.disabled = false;
  };

  screen.addEventListener("click", function (ev) {
    if (!liveId || !screen.naturalWidth) return;
    var rect = screen.getBoundingClientRect();
    var x = Math.round((ev.clientX - rect.left) / rect.width * screen.naturalWidth);
    var y = Math.round((ev.clientY - rect.top) / rect.height * screen.naturalHeight);
    post("/live/input", { id: liveId, kind: "tap", x: x, y: y }).catch(function () {});
  });

  document.getElementById("send").onclick = function () {
    var text = document.getElementById("typed").value;
    if (!liveId || !text) return;
    document.getElementById("typed").value = "";
    post("/live/input", { id: liveId, kind: "type", text: text }).catch(function () {});
  };
  document.getElementById("back").onclick = function () {
    if (!liveId) return;
    post("/live/input", { id: liveId, kind: "key", key: "Backspace" }).catch(function () {});
  };
  document.getElementById("enter").onclick = function () {
    if (!liveId) return;
    post("/live/input", { id: liveId, kind: "key", key: "Enter" }).catch(function () {});
  };
})();
</script>
</body>
</html>
