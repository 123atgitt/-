<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鳴潮主線小說</title>
<style>
:root {
  --bg: #ffffff;
  --ink: #1a1a1a;
  --muted: #666666;
  --line: #e5e5e5;
  --link: #1a1a1a;
  /* system UI stack — phone default */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
          "Hiragino Sans CNS", "Noto Sans TC", "Microsoft JhengHei",
          "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }

.shell {
  width: min(680px, 100% - 2rem);
  margin: 0 auto;
  padding: 1.75rem 0 3.5rem;
}

.brand {
  font-size: 1.75rem;
  font-weight: 600;
  margin: 0 0 .4rem;
  letter-spacing: 0.02em;
}
.tagline {
  color: var(--muted);
  margin: 0 0 1.75rem;
  font-size: .95rem;
  line-height: 1.5;
}

nav.toc {
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--line);
}
nav.toc a {
  display: block;
  padding: 1rem 0;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
}
nav.toc a:hover { background: transparent; text-decoration: none; }
nav.toc a:hover .title { text-decoration: underline; }
nav.toc .row {
  display: flex;
  gap: .65rem;
  align-items: baseline;
}
nav.toc .num {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  min-width: 1.6rem;
  flex-shrink: 0;
}
nav.toc .title {
  font-size: 1.05rem;
  font-weight: 500;
}
nav.toc .sub {
  display: block;
  margin: .25rem 0 0 2.25rem;
  color: var(--muted);
  font-size: .85rem;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  gap: .5rem 1rem;
  align-items: center;
  justify-content: space-between;
  padding: .75rem 0;
  margin: 0 0 1rem;
  background: rgba(255,255,255,.94);
  border-bottom: 1px solid var(--line);
}
.topbar .home {
  font-weight: 600;
  color: var(--ink);
}
.pager {
  display: flex;
  gap: .85rem;
  flex-wrap: wrap;
  font-size: .9rem;
}
.pager a { color: var(--muted); }
.pager a:hover { color: var(--ink); }

article.reader h1,
article.reader h2,
article.reader h3 {
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--ink);
  line-height: 1.4;
  font-family: var(--font);
}
article.reader h1 {
  font-size: 1.45rem;
  margin: 0 0 1.25rem;
  padding-bottom: .75rem;
  border-bottom: 1px solid var(--line);
}
article.reader h2 {
  font-size: 1.15rem;
  margin: 2rem 0 .85rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
}
article.reader h3 {
  font-size: 1.05rem;
  margin: 1.5rem 0 .6rem;
}
article.reader p {
  font-size: 1.05rem;
  line-height: 1.85;
  margin: .9em 0;
}
article.reader blockquote {
  margin: 1em 0;
  padding: 0 0 0 .9em;
  border-left: 2px solid var(--line);
  color: #444;
}

footer.note {
  margin-top: 2rem;
  color: var(--muted);
  font-size: .85rem;
  line-height: 1.5;
}

@media (max-width: 640px) {
  .shell { width: min(100% - 1.5rem, 680px); padding-top: 1.25rem; }
  .brand { font-size: 1.5rem; }
  article.reader p { font-size: 1.02rem; }
}
</style>
</head>
